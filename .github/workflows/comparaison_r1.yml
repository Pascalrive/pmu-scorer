name: Comparaison R1 quatre sites
on:
  schedule:
    # UTC: initial + bilan; controles courts toutes les 10 min, sans attente facturee.
    - cron: '0 8 * * *'
    - cron: '7,17,27,37,47,57 8-22 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      relay_probe:
        description: Internal no-bet relay verification
        type: boolean
        default: false
      recovery_attempt:
        description: Bounded recovery retry counter
        type: string
        default: "0"
      dry_run:
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['operations/live_window.py', 'comparaison_r1/policy.py', 'comparaison_r1/tests/test_simplification.py', 'comparaison_r1/*.py', 'comparaison_r1/tests/**', '.github/workflows/comparaison_r1.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: comparaison-r1-independant
  cancel-in-progress: false
jobs:
  comparaison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Filtrer les passages sans course utile
        id: window
        env:
          LIVE_POLL: ${{ github.event_name == 'schedule' && github.event.schedule == '7,17,27,37,47,57 8-22 * * *' }}
        run: python operations/live_window.py comparaison_r1
      - uses: actions/setup-python@v5
        if: steps.window.outputs.enabled == 'true'
        with:
          python-version: '3.12'
      - if: steps.window.outputs.enabled == 'true'
        run: pip install -r comparaison_r1/requirements.txt
      - name: Tests du protocole
        if: steps.window.outputs.enabled == 'true' && github.event_name != 'schedule'
        run: |
          python -m unittest discover -s comparaison_r1/tests -v
          python -m unittest comparaison_r1.tests.test_run_health comparaison_r1.tests.test_simplification -v
      - name: Collecte et bilan independants
        if: ${{ steps.window.outputs.enabled == 'true' && !inputs.relay_probe }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
        run: |
          TODAY=$(TZ=Europe/Paris date +%F)
          FLAGS=''
          if [ "$DRY_RUN" = true ]; then FLAGS='--dry-run'; fi
          if [[ "$TODAY" < '2026-10-16' ]]; then
            if [ ! -f comparaison_r1/data/probe/access.json ]; then
              python -m comparaison_r1.main --probe $FLAGS
            else
              python -m comparaison_r1.main --announce $FLAGS
            fi
          elif [[ "$TODAY" < '2026-12-23' ]]; then
            if [ "$DRY_RUN" = true ]; then
              python -m comparaison_r1.main --dry-run
            else
              python -m comparaison_r1.worker comparaison_r1 --persist --once
            fi
          fi
      - name: Persister les preuves et les recus
        if: ${{ always() && steps.window.outputs.enabled == 'true' && !inputs.relay_probe }}
        run: python -m comparaison_r1.worker comparaison_r1 --checkpoint-only
      - name: Verifier le passage de relais sans paris
        if: ${{ success() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m comparaison_r1.worker comparaison_r1 --probe-relay
      - name: Confirmer la reception du relais de controle
        if: ${{ inputs.relay_probe }}
        run: echo 'RELAY_PROBE_RECEIVED - no collection, no Telegram, no stakes'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.window.outputs.enabled == 'true' && !inputs.relay_probe }}
        with:
          name: comparaison-r1-${{ github.run_id }}
          path: comparaison_r1/data
          retention-days: 3




