name: Tony Artillan 3 sur 5
on:
  schedule:
    # 5 passages par jour (UTC) : 06h45, 11h02, 14h02, 17h02, 20h02 heure de Paris (hiver)
    - cron: '45 5 * * *'
    - cron: '2 10,13,16,19 * * *'
  workflow_dispatch:
    inputs:
      relay_probe:
        description: Internal no-bet relay verification
        type: boolean
        default: false
      recovery_attempt:
        description: Bounded recovery retry counter
        type: string
        default: "0"
      dry_run:
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['comparaison_r1/policy.py', 'comparaison_r1/tests/test_simplification.py', 'comparaison_r1/run_health.py', 'comparaison_r1/worker.py', 'tony_artillan_3_5/*.py', 'tony_artillan_3_5/tests/**', '.github/workflows/tony_artillan_3_5.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: tony-artillan-3-5-independant
  cancel-in-progress: false
jobs:
  comparaison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tony_artillan_3_5/requirements.txt
      - name: Tests du protocole
        run: |
          python -m unittest discover -s tony_artillan_3_5/tests -v
          python -m unittest comparaison_r1.tests.test_run_health comparaison_r1.tests.test_simplification -v
      - name: Collecte et bilan independants
        if: ${{ !inputs.relay_probe }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt || '0' }}
        run: |
          TODAY=$(TZ=Europe/Paris date +%F)
          FLAGS=''
          if [ "$DRY_RUN" = true ]; then FLAGS='--dry-run'; fi
          if [[ "$TODAY" < '2026-10-25' ]]; then
            python -m tony_artillan_3_5.main --announce $FLAGS
          elif [[ "$TODAY" < '2026-12-02' ]]; then
            if [ "$DRY_RUN" = true ]; then
              python -m tony_artillan_3_5.main --dry-run
            else
              python -m comparaison_r1.worker tony_artillan_3_5 --persist
            fi
          fi

      - name: Persister les preuves et les recus
        if: ${{ always() && !inputs.relay_probe }}
        run: python -m comparaison_r1.worker tony_artillan_3_5 --checkpoint-only
      - name: Verifier le passage de relais sans paris
        if: ${{ success() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m comparaison_r1.worker tony_artillan_3_5 --probe-relay
      - name: Confirmer la reception du relais de controle
        if: ${{ inputs.relay_probe }}
        run: echo 'RELAY_PROBE_RECEIVED - no collection, no Telegram, no stakes'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.relay_probe }}
        with:
          name: tony-artillan-3-5-${{ github.run_id }}
          path: tony_artillan_3_5/data
          retention-days: 90




