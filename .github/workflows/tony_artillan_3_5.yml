name: Tony Artillan 3 sur 5
on:
  schedule:
    - cron: '*/5 6-22 * * *'
    - cron: '45 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['tony_artillan_3_5/*.py', 'tony_artillan_3_5/tests/**', '.github/workflows/tony_artillan_3_5.yml']
permissions:
  contents: write
concurrency:
  group: tony-artillan-3-5-independant
  cancel-in-progress: false
jobs:
  comparaison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tony_artillan_3_5/requirements.txt
      - name: Tests du protocole
        run: python -m unittest discover -s tony_artillan_3_5/tests -v
      - name: Collecte et bilan independants
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          TODAY=$(TZ=Europe/Paris date +%F)
          FLAGS=''
          if [ "$DRY_RUN" = true ]; then FLAGS='--dry-run'; fi
          if [[ "$TODAY" < '2026-10-25' ]]; then
            python -m tony_artillan_3_5.main --announce $FLAGS
          elif [[ "$TODAY" < '2026-12-02' ]]; then
            python -m tony_artillan_3_5.main $FLAGS
          fi

      - name: Persister les preuves et les recus
        if: always()
        run: |
          mkdir -p tony_artillan_3_5/data
          git config user.name 'Tony Artillan 3/5'
          git config user.email 'tony-artillan-3-5@users.noreply.github.com'
          git add tony_artillan_3_5/data
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Tony Artillan 3/5'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tony-artillan-3-5-${{ github.run_id }}
          path: tony_artillan_3_5/data
          retention-days: 90

