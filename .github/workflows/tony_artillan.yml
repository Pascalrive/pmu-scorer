name: Tony Artillan independant
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tony_artillan/*.py', 'tony_artillan/tests/**', '.github/workflows/tony_artillan.yml']
permissions:
  contents: write
concurrency:
  group: tony-artillan-independant
  cancel-in-progress: false
jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tony_artillan/probe.py
      - name: Archiver le diagnostic Tony Artillan
        if: always()
        run: |
          git config user.name 'Tony Artillan'
          git config user.email 'tony-artillan@users.noreply.github.com'
          git add tony_artillan/data
          if ! git diff --cached --quiet; then
            git commit -m 'Archive diagnostic Tony Artillan'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
