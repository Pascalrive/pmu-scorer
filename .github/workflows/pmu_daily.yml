name: PMU Daily Scorer v15

on:
  schedule:
    - cron: '5 9 * * *'       # 11h05 Paris - scorer matin
    - cron: '15 9 * * *'      # 11h15 Paris - notifier session 1 (11h15-13h15)
    - cron: '30 10 * * *'     # 12h30 Paris - scorer midi
    - cron: '15 11 * * *'     # 13h15 Paris - notifier session 2 (13h15-15h15)
    - cron: '15 13 * * *'     # 15h15 Paris - notifier session 3 (15h15-17h15)
    - cron: '15 15 * * *'     # 17h15 Paris - notifier session 4 (17h15-19h15)
    - cron: '30 17 * * *'     # 19h30 Paris - bilan du soir
  workflow_dispatch:
    inputs:
      job:
        description: 'Job a lancer : scorer / notifier / results'
        required: true
        default: 'scorer'
        type: choice
        options:
          - scorer
          - notifier
          - results

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  scorer:
    name: Scores PMU v15
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scorer') ||
      (github.event_name == 'schedule' && (github.event.schedule == '5 9 * * *' || github.event.schedule == '30 10 * * *'))
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Creer dossier resultats
        run: mkdir -p resultats
      - name: Lancer scorer PMU v15
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_scorer.py
      - name: Sauvegarder CSV dans Git
        run: |
          git config user.name "PMU Bot"
          git config user.email "pmu@github-actions"
          git add resultats/*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "CSV $(date +%Y%m%d_%H%M)"
          git push || true
      - name: Sauvegarder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorer-logs
          path: pmu_scorer.log
          retention-days: 7
          overwrite: true
      - name: Afficher logs
        if: always()
        run: tail -60 pmu_scorer.log 2>/dev/null || true

  notifier:
    name: Notifier H-15min
    runs-on: ubuntu-latest
    timeout-minutes: 130
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'notifier') ||
      (github.event_name == 'schedule' && (github.event.schedule == '15 9 * * *' || github.event.schedule == '15 11 * * *' || github.event.schedule == '15 13 * * *' || github.event.schedule == '15 15 * * *'))

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Lancer notifier H-15min
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_notifier.py
      - name: Sauvegarder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifier-logs
          path: pmu_notifier.log
          retention-days: 7
          overwrite: true

  results:
    name: Bilan du soir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'results') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 17 * * *')

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Lancer bilan du soir
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_results.py
      - name: Sauvegarder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-logs
          path: pmu_results.log
          retention-days: 7
          overwrite: true
