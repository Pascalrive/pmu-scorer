# ============================================================
#  GitHub Actions - PMU Daily Scorer v8 + Bilan du soir
#
#  Trois executions par jour :
#    - 09h00 UTC (11h00 Paris) : pronostics du matin
#    - 10h30 UTC (12h30 Paris) : pronostics H-30 cotes fraiches
#    - 18h00 UTC (20h00 Paris) : bilan du soir
#
#  Secrets GitHub requis :
#    TELEGRAM_TOKEN    -> token de ton bot Telegram
#    TELEGRAM_CHAT_ID  -> ton Chat ID Telegram
#    ANTHROPIC_API_KEY -> cle Claude API (presse + pronostics externes)
# ============================================================

name: PMU Daily Scorer v8

on:
  schedule:
    - cron: '0 9 * * *'      # 11h00 Paris - pronostics du matin
    - cron: '30 10 * * *'    # 12h30 Paris - pronostics H-30
    - cron: '0 18 * * *'     # 20h00 Paris - bilan du soir
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  score:
    name: Analyser et envoyer sur Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # Necessite pour git push des CSV

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dependances
        run: pip install requests

      - name: Creer le dossier de resultats
        run: mkdir -p resultats

      - name: Lancer le scorer PMU v8 (pronostics)
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (contains(github.event.schedule, '0 9') || contains(github.event.schedule, '30 10'))) }}
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pmu_scorer.py

      - name: Sauvegarder le CSV dans le depot Git
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (contains(github.event.schedule, '0 9') || contains(github.event.schedule, '30 10'))) }}
        run: |
          git config user.name "PMU Scorer Bot"
          git config user.email "pmu-scorer@github-actions"
          git add resultats/*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "PMU CSV $(date +%Y%m%d_%H%M)"
          git push || true

      - name: Lancer le bilan du soir
        if: ${{ github.event_name == 'schedule' && contains(github.event.schedule, '0 18') }}
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_results.py

      - name: Sauvegarder logs en artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmu-logs
          path: |
            pmu_scorer.log
            pmu_results.log
          retention-days: 7
          overwrite: true

      - name: Afficher les derniers logs
        if: always()
        run: |
          echo "=== SCORER LOG ===" && tail -50 pmu_scorer.log 2>/dev/null || true
          echo "=== RESULTS LOG ===" && tail -30 pmu_results.log 2>/dev/null || true
