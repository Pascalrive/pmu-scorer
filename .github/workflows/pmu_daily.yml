name: PMU Daily Scorer v15.1

# Crons en UTC. Paris = UTC+2 (ete) ou UTC+1 (hiver).
# v15.1 : 1 scorer matin + 4 sessions notifier de 2h chacune
# Minutes choisies : 17, 23, 37, 47 (eviter 0, 5, 15, 30, 45).
on:
  schedule:
    # --- SCORER MATIN (11h17 + retry 11h47) ---
    - cron: '17 9 * * *'    # 11h17 Paris - scorer matin tir 1
    - cron: '47 9 * * *'    # 11h47 Paris - scorer matin tir 2 (retry si rate)

    # --- NOTIFIER : 4 sessions de 2h qui couvrent 11h30 -> 19h30 ---
    - cron: '23 9 * * *'    # 11h23 Paris - session 1 (couvre 11h30-13h30)
    - cron: '23 11 * * *'   # 13h23 Paris - session 2 (couvre 13h30-15h30)
    - cron: '23 13 * * *'   # 15h23 Paris - session 3 (couvre 15h30-17h30)
    - cron: '23 15 * * *'   # 17h23 Paris - session 4 (couvre 17h30-19h30)

    # --- BILAN DU SOIR ---
    - cron: '37 18 * * *'   # 20h37 Paris - bilan (apres derniere course)

  workflow_dispatch:
    inputs:
      job:
        description: 'Job a lancer : scorer / notifier / results / analyse'
        required: true
        default: 'scorer'
        type: choice
        options:
          - scorer
          - notifier
          - results
          - analyse

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  scorer:
    name: Scores PMU v15.1 (matin)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scorer') ||
      (github.event_name == 'schedule' && (
        github.event.schedule == '17 9 * * *' ||
        github.event.schedule == '47 9 * * *'
      ))
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Le tir de 11h47 ne s'execute que si le tir de 11h17 a echoue
      - name: Verifier si scorer matin deja execute
        id: check_csv
        run: |
          if [ "${{ github.event.schedule }}" = "47 9 * * *" ]; then
            DATE_TODAY=$(date +%Y%m%d)
            RECENT=$(find resultats -name "pmu_${DATE_TODAY}_*.csv" -mmin -60 2>/dev/null | wc -l)
            if [ "$RECENT" -gt "0" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "Scorer deja execute dans la derniere heure - retry annule"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.check_csv.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        if: steps.check_csv.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Creer dossier resultats
        if: steps.check_csv.outputs.skip != 'true'
        run: mkdir -p resultats
      - name: Lancer scorer PMU v15.1
        if: steps.check_csv.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_scorer.py
      - name: Sauvegarder CSV dans Git
        if: steps.check_csv.outputs.skip != 'true'
        run: |
          git config user.name "PMU Bot"
          git config user.email "pmu@github-actions"
          git add resultats/*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "CSV $(date +%Y%m%d_%H%M)"
          git push || true
      - name: Sauvegarder logs
        if: always() && steps.check_csv.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scorer-logs-${{ github.run_id }}
          path: pmu_scorer.log
          retention-days: 7
          overwrite: true

  notifier:
    name: Notifier H-15min v4
    runs-on: ubuntu-latest
    timeout-minutes: 130
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'notifier') ||
      (github.event_name == 'schedule' && (
        github.event.schedule == '23 9 * * *' ||
        github.event.schedule == '23 11 * * *' ||
        github.event.schedule == '23 13 * * *' ||
        github.event.schedule == '23 15 * * *'
      ))

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Lancer notifier H-15min v4
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_notifier.py
      - name: Sauvegarder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notifier-logs-${{ github.run_id }}
          path: pmu_notifier.log
          retention-days: 7
          overwrite: true

  results:
    name: Bilan du soir
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'results') ||
      (github.event_name == 'schedule' && github.event.schedule == '37 18 * * *')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Lancer bilan du soir
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_results.py
      - name: Sauvegarder CSV audit dans Git
        run: |
          git config user.name "PMU Bot"
          git config user.email "pmu@github-actions"
          git add resultats/audit_*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Audit $(date +%Y%m%d)"
          git push || true
      - name: Sauvegarder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-logs-${{ github.run_id }}
          path: pmu_results.log
          retention-days: 7
          overwrite: true

  analyse:
    name: Analyse audit accumulee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'analyse'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Compter les CSV audit disponibles
        run: |
          echo "Fichiers audit detectes :"
          ls -la resultats/audit_*.csv 2>/dev/null | wc -l
          ls -la resultats/audit_*.csv 2>/dev/null || echo "(aucun)"
      - name: Lancer analyse audit
        run: python analyse_audit.py | tee analyse_audit_rapport.txt
      - name: Sauvegarder rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyse-audit-rapport-${{ github.run_id }}
          path: analyse_audit_rapport.txt
          retention-days: 30
          overwrite: true
