name: PMU Daily Scorer v15.1

# Crons UTC : GitHub peut retarder ou manquer un passage.
# Collecte H60, actualisation H15, controle H5 selon le delai reel restant.
# Bilan a 20h30 UTC (21h30 Paris) pour la journee en cours, apres la derniere course.
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/pmu_daily.yml'
      - 'operations/morning_recovery.json'
      - 'operations/live_window.py'
  # UTC: scorer et bilan; notifier toutes les 10 min, seulement si course utile.
  schedule:
    - cron: '0 8 * * *'
    - cron: '7,17,27,37,47,57 8-22 * * *'
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job a lancer : scorer / notifier / results / analyse'
        required: true
        default: 'scorer'
        type: choice
        options:
          - scorer
          - notifier
          - results
          - analyse
          - verification
      date_bilan:
        description: 'Bilan uniquement : AAAAMMJJ (vide = aujourd hui a Paris)'
        required: false
        default: ''
      dry_run:
        description: 'Bilan uniquement : verifier sans envoi Telegram'
        type: boolean
        default: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pmu-collecte-production
  cancel-in-progress: false

jobs:

  scorer:
    name: Scores PMU v15.1 (matin)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'scorer') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[morning-recovery]')) ||
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 8 * * *'
      ))
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      # Toutes les tentatives relisent main après le verrou pour éviter les doublons.
      - name: Verifier si scorer matin deja execute
        id: check_csv
        run: |
          python - <<'PYCODE'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pmu_runtime import csv_du_jour
          day = datetime.now(ZoneInfo('Europe/Paris')).strftime('%Y%m%d')
          skip = csv_du_jour(day) is not None
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('skip=' + str(skip).lower() + '\n')
          print('Collecte du jour déjà archivée' if skip else 'Collecte du jour à lancer')
          PYCODE

      - uses: actions/setup-python@v5
        if: steps.check_csv.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        if: steps.check_csv.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Creer dossier resultats
        if: steps.check_csv.outputs.skip != 'true'
        run: mkdir -p resultats
      - name: Tester le journal et le bilan
        if: steps.check_csv.outputs.skip != 'true'
        run: python -m unittest discover -v -p 'test_pmu_*.py'
      - name: Lancer scorer PMU v15.1
        if: steps.check_csv.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_scorer.py
      - name: Verifier la collecte initiale
        if: steps.check_csv.outputs.skip != 'true'
        run: python pmu_runtime.py check
      - name: Archiver les preuves d envoi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resultats/journal/
            resultats/observations/
            resultats/pmu_*.csv
          retention-days: 90
          if-no-files-found: ignore
      - name: Persister le journal pour le bilan
        if: always()
        run: python persist_journal.py
      - name: Sauvegarder CSV dans Git
        if: steps.check_csv.outputs.skip != 'true'
        run: |
          git config user.name "PMU Bot"
          git config user.email "pmu@github-actions"
          git add resultats/*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "CSV $(date +%Y%m%d_%H%M)"
          git pull --rebase origin main
          git push
      - name: Sauvegarder logs
        if: always() && steps.check_csv.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scorer-logs-${{ github.run_id }}
          path: pmu_scorer.log
          retention-days: 7
          overwrite: true

  notifier:
    permissions:
      contents: write
    name: Notifier H-15min v4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'notifier') ||
      (github.event_name == 'schedule' && (
        github.event.schedule == '7,17,27,37,47,57 8-22 * * *'
      ))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Filtrer les passages sans course utile
        id: window
        env:
          LIVE_POLL: ${{ github.event_name == 'schedule' }}
        run: python operations/live_window.py scorer
      - uses: actions/setup-python@v5
        if: steps.window.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        if: steps.window.outputs.enabled == 'true'
        run: pip install -r requirements.txt
      - name: Tester le journal et le bilan
        if: steps.window.outputs.enabled == 'true' && github.event_name != 'schedule'
        run: python -m unittest discover -v -p 'test_pmu_*.py'
      - name: Lancer notifier H-15min v4
        if: steps.window.outputs.enabled == 'true'
        env:
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pmu_runtime.py collect
      - name: Archiver les preuves d envoi
        if: always() && steps.window.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resultats/journal/
            resultats/observations/
            resultats/pmu_*.csv
          retention-days: 3
          if-no-files-found: ignore
      - name: Persister le journal pour le bilan
        if: always() && steps.window.outputs.enabled == 'true'
        run: python persist_journal.py
      - name: Sauvegarder logs
        if: always() && steps.window.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: notifier-logs-${{ github.run_id }}
          path: pmu_notifier.log
          retention-days: 3
          overwrite: true

  results:
    name: Bilan de la journee terminee
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'results') ||
      (github.event_name == 'schedule' && github.event.schedule == '30 20 * * *')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Tester le journal et le bilan
        run: python -m unittest discover -v -p 'test_pmu_*.py'
      - name: Lancer bilan du soir
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PMU_BILAN_DATE_INPUT: ${{ inputs.date_bilan }}
          PMU_SCHEDULED: '0'  # bilan du soir : journee en cours, pas la veille
          PMU_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python pmu_runtime.py bilan
      - name: Archiver le bilan et ses sources officielles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilan-officiel-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            resultats/bilans/
            resultats/officiels/
          retention-days: 90
          if-no-files-found: ignore
      - name: Persister le bilan officiel
        if: always()
        run: python persist_journal.py
      - name: Sauvegarder CSV audit dans Git
        run: |
          git config user.name "PMU Bot"
          git config user.email "pmu@github-actions"
          git add resultats/audit_*.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Audit $(date +%Y%m%d)"
          git pull --rebase origin main
          git push
      - name: Sauvegarder logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-logs-${{ github.run_id }}
          path: pmu_results.log
          retention-days: 7
          overwrite: true

  analyse:
    name: Analyse audit accumulee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'analyse'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Installer dependances
        run: pip install -r requirements.txt
      - name: Compter les CSV audit disponibles
        run: |
          echo "Fichiers audit detectes :"
          ls -la resultats/audit_*.csv 2>/dev/null | wc -l
          ls -la resultats/audit_*.csv 2>/dev/null || echo "(aucun)"
      - name: Lancer analyse audit
        run: python analyse_audit.py | tee analyse_audit_rapport.txt
      - name: Sauvegarder rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyse-audit-rapport-${{ github.run_id }}
          path: analyse_audit_rapport.txt
          retention-days: 30
          overwrite: true

  verification:
    name: Verification sans Telegram
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'verification')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v -p 'test_pmu_*.py'
      - run: python -m compileall -q pmu_tracking.py pmu_scorer.py pmu_notifier.py pmu_signaux.py pronos_gratuit.py pmu_results.py persist_journal.py pmu_runtime.py
      - name: Diagnostic lecture seule de la veille et du jour
        run: python pmu_runtime.py diagnostic "$(TZ=Europe/Paris date -d yesterday +%Y%m%d)" "$(TZ=Europe/Paris date +%Y%m%d)"


